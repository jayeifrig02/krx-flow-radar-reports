name: KRX network check
on:
  push:
    paths: ['.github/workflows/krx-network-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: krx-network-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public KRX connectivity without credentials
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          for url in ['https://data.krx.co.kr/', 'https://data.krx.co.kr/comm/bldAttendant/getJsonData.cmd']:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      print(json.dumps({'endpoint':url,'status':r.status,'reachable':True}))
              except urllib.error.HTTPError as e:
                  print(json.dumps({'endpoint':url,'status':e.code,'reachable':True}))
              except Exception as e:
                  print(json.dumps({'endpoint':url,'reachable':False,'error_type':type(e).__name__}))
          PY
